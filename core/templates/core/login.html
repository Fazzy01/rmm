<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RMM Login</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #1a1a1a; border: 1px solid #292929; border-radius: 8px;
          padding: 28px 32px; width: 300px; }
  h1 { font-size: 20px; margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: #888; text-transform: uppercase;
          letter-spacing: 0.05em; margin-bottom: 6px; }
  input[type=text], input[type=password] {
      width: 100%; box-sizing: border-box; background: #222; color: #fff;
      border: 1px solid #333; padding: 9px 10px; border-radius: 4px;
      font-size: 14px; margin-bottom: 16px; }
  input:focus { outline: none; border-color: #2d6cdf; }
  button { width: 100%; background: #2d6cdf; color: #fff; border: none; padding: 10px;
           border-radius: 4px; cursor: pointer; font-size: 14px; }
  button:hover { background: #1f56b8; }
  .error { background: #7f1a1a; color: #fff; padding: 8px 10px; border-radius: 4px;
           font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>
  <form class="card" method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <h1>RMM Sign in</h1>
    {% if form.errors %}
      <div class="error">Invalid username or password.</div>
    {% endif %}
    <label for="id_username">Username</label>
    {{ form.username }}
    <label for="id_password">Password</label>
    {{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
